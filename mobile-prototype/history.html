<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat - NoFTe</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <img src="assets/logo.png" class="logo-icon" alt="Logo">
                <span class="logo-text">NoFTe</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item">
                <span class="nav-icon">&#127968;</span>
                <span class="nav-label">Dashboard</span>
            </a>
            <a href="scan.html" class="nav-item">
                <span class="nav-icon">&#128247;</span>
                <span class="nav-label">Scan Makanan</span>
            </a>
            <a href="history.html" class="nav-item active">
                <span class="nav-icon">&#128196;</span>
                <span class="nav-label">Riwayat</span>
            </a>
            <a href="expiry.html" class="nav-item">
                <span class="nav-icon">&#9200;</span>
                <span class="nav-label">Kadaluarsa</span>
            </a>
            <a href="inventory.html" class="nav-item">
                <span class="nav-icon">&#128230;</span>
                <span class="nav-label">Inventory</span>
            </a>
            <a href="assistant.html" class="nav-item">
                <span class="nav-icon">&#129302;</span>
                <span class="nav-label">AI Assistant</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="settings.html" class="nav-item">
                <span class="nav-icon">&#9881;</span>
                <span class="nav-label">Pengaturan</span>
            </a>
            <div class="user-card">
                <div class="user-avatar">C</div>
                <div class="user-info">
                    <h4>Chesta</h4>
                    <p>Premium User</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- SIDEBAR OVERLAY -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- HEADER -->
        <header class="header">
            <div class="mobile-header">
                <button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button>
            </div>
            <div class="header-left">
                <h1>&#128196; Riwayat Scan</h1>
                <p>Semua hasil scan makanan Anda</p>
            </div>
            <div class="header-actions">
                <button class="icon-btn">&#128269;</button>
                <button class="icon-btn notification-btn" id="notificationBtn">
                    &#128276;
                    <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
                </button>
            </div>
        </header>

        <!-- NOTIFICATION DROPDOWN -->
        <div class="notification-dropdown" id="notificationDropdown">
            <div class="notification-header">
                <h3>&#9888; Peringatan Kadaluarsa</h3>
                <span class="notification-count" id="notificationCount">0</span>
            </div>
            <div class="notification-list" id="notificationList">
                <div class="notification-empty">
                    <div class="notification-empty-icon">&#8987;</div>
                    <p>Memuat...</p>
                </div>
            </div>
            <div class="notification-footer">
                <a href="expiry.html">Lihat semua &#8594;</a>
            </div>
        </div>

        <!-- PAGE CONTENT -->
        <div class="page-content">

            <!-- SEARCH -->
            <div class="search-box">
                <span style="font-size: 18px;">&#128269;</span>
                <input type="text" id="searchFood" placeholder="Cari makanan...">
            </div>

            <!-- HISTORY LIST -->
            <div class="card">
                <div class="card-header">
                    <h2>&#128203; Riwayat Scan</h2>
                </div>
                <div id="historyList">
                    <!-- Dynamic content -->
                </div>
            </div>

        </div>
    </main>
</div>

<script src="auth.js"></script>
<script src="history.js"></script>
<script src="notifications.js"></script>
<script>
// Apply saved theme on load
(function() {
    const savedTheme = localStorage.getItem('nofte-theme') || 'dark';
    if (savedTheme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
    }
})();

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('active');
}

document.getElementById('sidebarOverlay').addEventListener('click', function() {
    this.classList.remove('active');
    document.getElementById('sidebar').classList.remove('open');
});
</script>

</body>
</html>
